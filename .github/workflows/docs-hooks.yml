name: Repository checks

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README*.md'
      - 'CHANGELOG*.md'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/*.json'
      - '.gitignore'
      - '.codex/hooks.json'
      - 'scripts/docs-hooks*'
      - 'scripts/check-version*'
      - 'scripts/affinity-mcp-proxy.test.mjs'
      - 'scripts/inspection-preview.test.mjs'
      - 'skills/affinity-mcp/scripts/inspection-preview.mjs'
      - 'assets/sdk-evidence/poster-*.png'
      - 'assets/sdk-evidence/poster-inspection*-geometry.json'
      - 'skills/affinity-mcp/scripts/affinity-mcp-proxy.mjs'
      - 'skills/affinity-mcp/scripts/affinity-mcp-smoke.mjs'
      - '.github/workflows/docs-hooks.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README*.md'
      - 'CHANGELOG*.md'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/*.json'
      - '.gitignore'
      - '.codex/hooks.json'
      - 'scripts/docs-hooks*'
      - 'scripts/check-version*'
      - 'scripts/affinity-mcp-proxy.test.mjs'
      - 'scripts/inspection-preview.test.mjs'
      - 'skills/affinity-mcp/scripts/inspection-preview.mjs'
      - 'assets/sdk-evidence/poster-*.png'
      - 'assets/sdk-evidence/poster-inspection*-geometry.json'
      - 'skills/affinity-mcp/scripts/affinity-mcp-proxy.mjs'
      - 'skills/affinity-mcp/scripts/affinity-mcp-smoke.mjs'
      - '.github/workflows/docs-hooks.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: node scripts/docs-hooks.mjs check
      - run: node --test scripts/docs-hooks.test.mjs
      - name: Check snapshot version
        run: >
          node --input-type=module -e "import { readFileSync } from 'node:fs';
          import { checkRepository } from './scripts/check-version.mjs';
          const version = JSON.parse(readFileSync('.codex-plugin/plugin.json', 'utf8')).version;
          console.log(JSON.stringify(checkRepository(process.cwd(), { channel: typeof version === 'string' && version.includes('-dev.') ? 'development' : 'stable' }), null, 2));"
      - run: node --test scripts/check-version.test.mjs
      - run: node --test scripts/inspection-preview.test.mjs
